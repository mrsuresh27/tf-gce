name: 'Terraform GCE Deploy'

on:
  push:
    branches:
      - main
    paths:
      - 'tf-gce/**'
  pull_request:
    branches:
      - main
    paths:
      - 'tf-gce/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WORKLOAD_IDENTITY_PROVIDER: 'projects/629423970153/locations/global/workloadIdentityPools/gce-wif/providers/github'
  SERVICE_ACCOUNT: 'sa-gce@hip-runner-477914-h3.iam.gserviceaccount.com'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tf-gce

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan -var="project_id=hip-runner-477914-h3" -input=false

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -var="project_id=hip-runner-477914-h3" -input=false
